aid: back
name: Back
description: >-
  Back is a Berlin-based employee experience and internal service platform that
  gives HR, IT, Finance, and Office teams one place to receive, automate, and
  resolve employee requests. It brings conversations from Slack, Microsoft Teams,
  and email into a single shared inbox, answers common questions with a
  self-service knowledge chatbot, and automates lifecycle journeys such as
  onboarding, offboarding, and leave with approvals, forms, and integrations.
  Founded in 2018 and backed by Point Nine and Seedcamp, Back is used by
  companies including Loom, Netlify, Choco, Pleo, Marley Spoon, and Statista.
  This profile was surfaced as a VC portfolio company and enriched by the API
  Evangelist pipeline; Back offers an API for custom integrations on select
  plans, but publishes no public developer portal, OpenAPI, or reference at time
  of enrichment.
